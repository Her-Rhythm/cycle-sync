<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cycle Sync: understand her cycle, support her every phase</title>
<meta name="description" content="A plain-English guide to the four phases of the menstrual cycle for partners: what she may be feeling, what to cook, what to plan, and how to help. Free, private, no account.">
<meta name="theme-color" content="#FBF7F1">
<meta property="og:title" content="Cycle Sync: understand her cycle, support her every phase">
<meta property="og:description" content="Phase-by-phase meal ideas, activities, a cycle calendar with predictions, and local spots to try. Free and private.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2032%2032%22%3E%3Ccircle%20cx=%228%22%20cy=%228%22%20r=%227.2%22%20fill=%22%23F4DEDF%22/%3E%3Cpath%20d=%22M8%200.7999999999999998A7.2%207.2%200%200%201%208%2015.2A3.4%207.2%200%200%200%208%200.7999999999999998Z%22%20fill=%22%23B23A48%22/%3E%3Ccircle%20cx=%2224%22%20cy=%228%22%20r=%227.2%22%20fill=%22%23E3EDDE%22/%3E%3Cpath%20d=%22M24%200.7999999999999998A7.2%207.2%200%200%201%2024%2015.2Z%22%20fill=%22%234F7A5A%22/%3E%3Ccircle%20cx=%228%22%20cy=%2224%22%20r=%227.2%22%20fill=%22%23FBE7C4%22/%3E%3Ccircle%20cx=%228%22%20cy=%2224%22%20r=%227.2%22%20fill=%22%23C97E1E%22/%3E%3Ccircle%20cx=%2224%22%20cy=%2224%22%20r=%227.2%22%20fill=%22%23E6E1F1%22/%3E%3Cpath%20d=%22M24%2016.8A7.2%207.2%200%200%200%2024%2031.2Z%22%20fill=%22%236C5A92%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --cream:#FBF7F1; --paper:#FFFFFF; --ink:#2B2420; --soft:#6B6258; --line:#E8E0D3;
  --rose:#B23A48; --rose-soft:#F4DEDF; --rose-ink:#8E2B37;
  --green:#4F7A5A; --green-soft:#E3EDDE; --green-ink:#355A40;
  --amber:#C97E1E; --amber-deep:#A8610F; --amber-soft:#FBE7C4; --amber-ink:#8A5208;
  --purple:#6C5A92; --purple-soft:#E6E1F1; --purple-ink:#54447A;
  --c-menstrual:#B23A48; --c-follicular:#4F7A5A; --c-ovulation:#C97E1E; --c-luteal:#6C5A92;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
}
.t-menstrual{--pc:#B23A48;--ps:#F4DEDF;--pi:#8E2B37;--pb:#B23A48;--pd:#8E2B37}
.t-follicular{--pc:#4F7A5A;--ps:#E3EDDE;--pi:#355A40;--pb:#4F7A5A;--pd:#355A40}
.t-ovulation{--pc:#C97E1E;--ps:#FBE7C4;--pi:#8A5208;--pb:#A8610F;--pd:#8A5208}
.t-luteal{--pc:#6C5A92;--ps:#E6E1F1;--pi:#54447A;--pb:#6C5A92;--pd:#54447A}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--cream);line-height:1.5;font-size:16px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;margin:0}
p{margin:0}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.skip{position:absolute;left:-9999px;top:8px;background:#fff;padding:10px 14px;border-radius:8px;z-index:100;font-weight:600}
.skip:focus{left:16px}
.container{max-width:1296px;margin:0 auto;padding:0 clamp(16px,5vw,72px)}
.glyph{font-family:'Segoe UI Symbol','Noto Sans Symbols','Noto Sans Symbols 2','DejaVu Sans',sans-serif;font-variant-emoji:text;line-height:1}
.em{font-family:var(--emoji)}

/* header + nav */
header.top{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:72px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:600;font-size:20px;text-decoration:none}
nav.main{display:flex;gap:30px}
nav.main a{min-height:44px;display:inline-flex;align-items:center;text-decoration:none;color:var(--soft);font-weight:500;font-size:15px;border-bottom:2px solid transparent;padding-top:2px}
nav.main a[aria-current="page"]{color:var(--ink);font-weight:700;border-color:var(--rose)}
nav.main svg{display:none}
.privacy{font-size:13px;color:var(--soft)}

/* common */
.view{padding:clamp(28px,5vw,56px) 0 clamp(48px,8vw,88px)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--rose-ink)}
.h1{font-size:clamp(32px,5.2vw,52px);line-height:1.08;letter-spacing:-.01em;margin:10px 0 14px}
.lead{font-size:clamp(16px,2vw,18px);color:var(--soft);max-width:640px;line-height:1.65}
.sec{margin-top:clamp(40px,6vw,64px)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap;margin-bottom:20px}
.sec-head h2,.h2{font-size:clamp(24px,3.2vw,30px)}
.link{font-size:14px;font-weight:700;text-decoration:underline;background:none;border:0;padding:0;min-height:44px;display:inline-flex;align-items:center}
.muted{color:var(--soft)}
.tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 28px;border-radius:999px;font-weight:600;font-size:16px;border:1.5px solid var(--ink);text-decoration:none;background:var(--ink);color:var(--cream)}
.btn.line{background:transparent;color:var(--ink)}
.btn.sm{min-height:44px;padding:0 20px;font-size:14px}
.btn.wh{background:#fff;color:var(--ink);border-color:#fff}
.chip{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.field,select.field{min-height:48px;padding:0 14px;border-radius:12px;border:1px solid #CFC6B8;background:#fff;font-size:16px;max-width:100%}
.lbl{font-size:13px;font-weight:600;color:var(--soft);display:block;margin-bottom:8px}
.g2,.g3,.g4{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.note{font-size:12.5px;color:var(--soft);line-height:1.6;margin-top:14px}
.msg{font-size:14px;color:var(--rose-ink);font-weight:600;min-height:20px}
.li{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.55}
.ic{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:1px;background:var(--ps,#eee);color:var(--pi,#333)}
.list{display:flex;flex-direction:column;gap:14px}
.emtile{width:48px;height:48px;border-radius:12px;background:var(--ps);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;font-family:var(--emoji)}

/* strip */
.strip{position:relative}
.strip .bar{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden}
.strip .bar i{display:block}
.strip .mark{position:absolute;top:-6px;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.strip .lab{display:flex;gap:2px;margin-top:10px;font-size:11.5px;color:var(--soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:13px 0;border-top:1px solid var(--line);font-size:14px}
.row span{color:var(--soft)}
.row strong{text-align:right}

/* start */
.start-grid{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:40px;align-items:start;margin-top:32px}
.form{padding:clamp(22px,4vw,44px);display:flex;flex-direction:column;gap:36px}
.step-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.step-h h2{font-size:22px;font-weight:600}
.num{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.opt{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
hr.sep{border:0;border-top:1px solid var(--line);margin:0}
.mc{background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:420px}
.mc-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mc-h h3{font-size:17px;font-weight:600}
.mc-nav{display:flex;gap:6px}
.sq{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px}
.sq:disabled{opacity:.4;cursor:default}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mgrid .wk{text-align:center;font-size:11.5px;font-weight:700;color:var(--soft);letter-spacing:.05em;padding-bottom:4px}
.day{height:44px;border-radius:10px;border:0;background:transparent;font-size:14px;font-weight:600}
.day.sel{background:var(--rose);color:#fff}
.day.est{background:var(--rose-soft);color:var(--rose-ink)}
.day.now{box-shadow:inset 0 0 0 2px var(--ink)}
.day:disabled{color:#A39A8E;font-weight:500;cursor:default}
.mc-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:13.5px}
.help{display:flex;gap:12px;align-items:flex-start;background:var(--rose-soft);border-radius:14px;padding:16px 18px;max-width:420px;color:var(--rose-ink);font-size:13.5px;line-height:1.55}
.bday{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.signchip{flex:1 1 240px;min-height:48px;display:flex;align-items:center;gap:14px;background:var(--purple-soft);border-radius:14px;padding:10px 18px;color:var(--purple-ink)}
.signchip .glyph{font-size:30px}
.signchip b{display:block;font-size:15px}
.signchip small{font-size:12.5px}
.actions{display:flex;align-items:center;justify-content:space-between;gap:20px 24px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--soft)}
.chk input{width:22px;height:22px;accent-color:#2B2420}
.prev{padding:32px}
.prev .big{font-family:var(--serif);font-size:clamp(44px,7vw,60px);font-weight:600;line-height:1;display:flex;align-items:baseline;gap:12px;margin-top:16px}
.prev .big span{font-family:var(--sans);font-size:15px;font-weight:400;color:var(--soft)}
.pill{display:inline-block;margin-top:14px;padding:8px 16px;border-radius:999px;background:var(--ps);color:var(--pi);font-size:14px;font-weight:700}
.green-note{padding:28px 32px;background:var(--green-soft);border:1px solid #CFE0C9;border-radius:20px;color:var(--green-ink)}
.green-note h3{font-size:18px;font-weight:600;margin-bottom:8px}
.green-note p{font-size:14.5px;line-height:1.6}
.pcard{display:flex;flex-direction:column;gap:12px;padding:26px;text-decoration:none;border-top:6px solid var(--pc);color:var(--ink);text-align:left;border-radius:20px;background:#fff;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);width:100%}
.pcard h3{font-size:22px;font-weight:600}
.pcard p{font-size:14px;color:var(--soft);line-height:1.5}
.pcard .tag{color:var(--pi)}
.picon{width:44px;height:44px;border-radius:50%;background:var(--ps);display:flex;align-items:center;justify-content:center;color:var(--pi)}

/* banner (today / phases) */
.banner{background:var(--pd);color:#fff;border-radius:24px;padding:clamp(24px,4vw,56px);display:flex;gap:clamp(24px,4vw,56px);align-items:center;flex-wrap:wrap}
.banner .b-left{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:14px}
.banner .eb{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.88)}
.banner h1{font-size:clamp(34px,5.2vw,54px);line-height:1.05;letter-spacing:-.01em;color:#fff}
.banner .focus{font-family:var(--serif);font-style:italic;font-size:clamp(18px,2.4vw,22px);color:rgba(255,255,255,.92)}
.banner p{font-size:16.5px;line-height:1.65;color:rgba(255,255,255,.94);max-width:620px}
.bchips{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.bchip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:14px;font-weight:600;text-decoration:none}
button.bchip{background:rgba(255,255,255,.12)}
.glance{flex:0 1 460px;min-width:min(100%,300px);background:#fff;color:var(--ink);border-radius:22px;padding:28px 30px}
.glance .tag{color:var(--soft);display:block;margin-bottom:22px}
.glance .strip+.legend{display:none}
.alert{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--amber-soft);color:var(--amber-ink);border-radius:16px;padding:16px 20px;margin-bottom:20px;font-size:14.5px}
.pms-flag{background:#fff;color:var(--pd);font-weight:700}

.pb-card{padding:28px;display:flex;flex-direction:column;gap:16px}
.pb-card h3{font-size:20px;font-weight:600;display:flex;align-items:center;gap:12px}
.badge{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;font-family:var(--sans)}
.dinner{display:flex;flex-direction:column;overflow:hidden;padding:0}
.dinner .pic{height:130px;background:var(--ps);display:flex;align-items:center;justify-content:center;font-size:56px;font-family:var(--emoji)}
.dinner .bd{padding:24px 28px 28px;display:flex;flex-direction:column;gap:8px}
.dinner h3{font-size:20px;font-weight:600;line-height:1.25}

.signcard{display:flex;overflow:hidden;flex-wrap:wrap}
.sc-id{flex:0 0 240px;background:var(--purple-soft);color:var(--purple-ink);padding:28px;display:flex;flex-direction:column;gap:6px}
.sc-id .glyph{font-size:68px}
.sc-id h3{font-size:30px;font-weight:600;margin-top:6px}
.sc-body{flex:1 1 340px;padding:28px 32px;display:flex;flex-direction:column;gap:18px;min-width:0}
.sc-body h4{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
.sc-body p{font-size:15px;line-height:1.65}
.sc-say{flex:0 1 300px;min-width:240px;background:var(--ink);color:#fff;padding:28px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.sc-say .tag{color:#D9D2C7}
.sc-say p{font-family:var(--serif);font-size:21px;line-height:1.4}
.cta-card{padding:32px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--purple-soft);border-color:#CFC7E4;color:var(--purple-ink)}
.cta-card h3{font-size:20px;font-weight:600}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.tile .bar{height:6px;background:var(--pc)}
.tile .b{padding:14px 14px 16px;display:flex;flex-direction:column;gap:6px}
.tile .d{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.tile .n{font-family:var(--serif);font-size:22px;font-weight:600}
.tile .x{font-size:13.5px;line-height:1.5}
.tile.today{border:2px solid var(--ink)}
.tile.pms{background:var(--ps);border-color:rgba(0,0,0,.1)}
.tile.pms .bar{background:var(--pi)}
.tile.pms .d,.tile.pms .n,.tile.pms .x{color:var(--pi)}

/* local finder */
.lf{background:var(--ink);color:#fff;border:0;border-radius:24px;padding:clamp(24px,4vw,44px) clamp(20px,4vw,48px)}
.lf-top{display:flex;gap:clamp(20px,4vw,56px);flex-wrap:wrap;align-items:flex-start}
.lf-top>div{flex:1 1 320px;min-width:0}
.lf h2{font-size:clamp(22px,3vw,28px);color:#fff;margin:10px 0}
.lf .tag{color:#E7B9BE}
.lf p.sub{font-size:14.5px;line-height:1.6;color:#D9D2C7;max-width:520px;margin-bottom:20px}
.lf form{display:flex;gap:12px;max-width:460px}
.lf input{flex:1;min-width:0;min-height:48px;padding:0 18px;border-radius:12px;border:0;font-size:16px;color:var(--ink);background:#fff}
.lf button.go{min-height:48px;padding:0 24px;border-radius:12px;border:0;background:#fff;color:var(--ink);font-weight:700;font-size:15px}
.lf .msg{color:#FFC9CF;margin-top:10px}
.lf h3{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#D9D2C7;margin:0 0 12px}
.lf-chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lf-chip{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:60px;padding:10px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.3);color:#fff;text-decoration:none;font-size:14px;background:rgba(255,255,255,.06)}
.lf-chip:hover{background:rgba(255,255,255,.14)}
.lf-chip b{display:block;font-weight:600}
.lf-chip small{display:block;font-size:12.5px;color:#D9D2C7}
.lf-chip.off{opacity:.7}
.lf .grp+.grp{margin-top:22px}

/* phases */
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.ptab{min-height:48px;padding:0 20px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:8px}
.ptab[aria-pressed="true"]{background:var(--pb);color:#fff;border-color:var(--pb)}
.ptab .here{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--ink);color:#fff;border-radius:999px;padding:2px 8px}
.ptab[aria-pressed="true"] .here{background:#fff;color:var(--pd)}
.feel{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.feel span{font-size:13px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28)}
.forhim{padding:28px 32px;border-left:5px solid var(--pc)}
.forhim h3{font-size:19px;font-weight:600;margin-bottom:14px}
.col{border-radius:20px;border:1px solid var(--line);background:#fff;overflow:hidden}
.col-h{padding:16px 24px;font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.col-h.good{background:var(--green-soft);color:var(--green-ink)}
.col-h.bad{background:var(--rose-soft);color:var(--rose-ink)}
.col-h .badge{width:22px;height:22px;font-size:12px}
.frow{display:flex;gap:16px;align-items:center;padding:14px 24px;border-top:1px solid var(--line)}
.frow:first-of-type{border-top:0}
.frow b{display:block;font-size:15px;font-weight:600}
.frow span.d{display:block;font-size:13.5px;color:var(--soft)}
.meal{padding:22px;display:flex;flex-direction:column;gap:8px}
.meal .tag{color:var(--pi)}
.meal b{font-size:15.5px;font-weight:600;line-height:1.35}
.meal .why{font-size:13.5px;color:var(--soft)}
.meal .emtile{margin-bottom:4px}
.act{padding:22px;display:flex;gap:16px;align-items:center}
.act b{display:block;font-size:15px}

.tipcard{padding:20px;display:flex;gap:14px;align-items:center;font-weight:600;font-size:14.5px}
.rem{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}

.cal-grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:40px;align-items:start}

.side .card{padding:26px}
.side h3{font-size:17px;font-weight:600;margin-bottom:14px}
.side .fld{margin-bottom:16px}
.side .field{width:100%}
.preds{background:var(--ink);color:#fff;border:0}
.preds h3{color:#fff}
.preds .row{border-top:0;padding:7px 0;color:#E2DDD4}

.preds .row strong{color:#fff}
.logrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.logrow button{background:none;border:0;color:var(--rose-ink);font-weight:700;font-size:13px;text-decoration:underline;min-height:44px;padding:0 4px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px}
.cal-h h2{font-size:clamp(22px,3vw,26px)}
.cal{padding:22px}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cgrid .wk{text-align:center;font-size:12px;font-weight:700;color:var(--soft);letter-spacing:.05em;margin-bottom:2px}
.c{aspect-ratio:1/1;border-radius:12px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;font-size:13px;font-weight:600;border:0;text-align:left;min-width:0}
.c small{font-size:10px;font-weight:700;letter-spacing:.02em;line-height:1.15;text-align:left}
.c.m{background:var(--rose-soft);color:var(--rose-ink)}
.c.f{background:var(--green-soft);color:var(--green-ink)}
.c.o{background:var(--amber-soft);color:var(--amber-ink)}
.c.l{background:var(--purple-soft);color:var(--purple-ink)}
.c.m1{background:var(--rose);color:#fff}
.c.o1{background:var(--amber-deep);color:#fff}
.c.p{background:var(--purple);color:#fff}
.c.nx{background:#fff;border:1.5px dashed var(--rose);color:var(--rose-ink)}
.c.out{opacity:.55}
.c.now{box-shadow:inset 0 0 0 2.5px var(--ink)}
.c[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.detail{margin-top:20px;padding:24px 28px;border-left:5px solid var(--pc)}
.detail h3{font-size:20px;font-weight:600;margin-bottom:6px}
.detail .li{margin-top:10px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.lg{display:flex;flex-direction:column;gap:10px;font-size:14px}
.lg div{display:flex;align-items:center;gap:10px}

.zhero{display:flex;gap:clamp(24px,5vw,64px);align-items:center;flex-wrap:wrap}
.zhero>div:first-child{flex:1 1 440px;min-width:0}
.finder{flex:0 1 430px;min-width:min(100%,300px);padding:30px}
.finder h2{font-size:20px;font-weight:600;margin-bottom:18px}
.finder .pair{display:flex;gap:14px;margin-bottom:18px}
.sign{display:flex;flex-direction:column;gap:6px;padding:22px;background:#fff;border:1px solid var(--line);border-radius:18px}

.sign .top{display:flex;justify-content:space-between;align-items:flex-start}
.sign .g{font-size:34px;color:var(--purple-ink)}
.sign h3{font-size:20px;font-weight:600;margin-top:6px}
.sign .dt{font-size:12.5px;color:var(--soft)}
.sign .el{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.sign p{font-size:14px;line-height:1.5}
.sign .sup{font-size:13.5px;color:var(--soft)}
.sign .sup strong{color:var(--ink)}
.el-card{padding:26px;display:flex;flex-direction:column;gap:14px}
.el-card h3{font-size:20px;font-weight:600}
.el-card .signs{font-size:13.5px;color:var(--soft);margin-top:-8px}
.el-card .lead2{font-size:14.5px;line-height:1.6}
.ph-row{padding:12px 14px;border-radius:12px;background:var(--ps);font-size:13.5px;line-height:1.55;color:var(--ink)}
.ph-row b{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--pi);margin-bottom:2px}
.ph-row.now{box-shadow:0 0 0 2.5px var(--pi)}
.disc{background:var(--ink);color:#fff;border-radius:22px;padding:clamp(24px,4vw,36px) clamp(22px,4vw,44px);display:flex;gap:clamp(16px,4vw,40px);align-items:flex-start;flex-wrap:wrap}
.disc h3{font-size:22px;flex:0 0 240px;color:#fff}
.disc p{flex:1 1 360px;font-size:15px;line-height:1.7;color:#E2DDD4}

footer.foot{border-top:1px solid var(--line);padding:28px 0 36px;font-size:13px;color:var(--soft)}
.foot-in{display:flex;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;align-items:center}
.foot button{background:none;border:0;text-decoration:underline;color:var(--soft);min-height:44px;padding:0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
noscript{display:block;padding:32px;text-align:center}

@media (max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rem{grid-template-columns:repeat(3,minmax(0,1fr))}
  .start-grid{grid-template-columns:minmax(0,1fr)}
  .cal-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .g3{grid-template-columns:minmax(0,1fr)}
  .week{display:flex;overflow-x:auto;margin:0 calc(-1 * clamp(16px,5vw,72px));padding:2px clamp(16px,5vw,72px) 10px;gap:10px;scroll-snap-type:x proximity}
  .tile{flex:0 0 150px;scroll-snap-align:start}
  .sc-id{flex-basis:100%}
}
@media (max-width:860px){
  .privacy{display:none}
  .top-in{min-height:60px}

  nav.main a{flex:1;flex-direction:column;justify-content:center;gap:3px;font-size:11px;min-height:56px;border-bottom:0;padding:0 2px;text-align:center;font-weight:600}
  nav.main a[aria-current="page"]{color:var(--purple-ink);border:0}
  nav.main svg{display:block}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  #toast{bottom:calc(88px + env(safe-area-inset-bottom))}
}
@media (max-width:640px){
  .g2,.g4{grid-template-columns:minmax(0,1fr)}
  .rem{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lf-chips{grid-template-columns:minmax(0,1fr)}
  .lf form{flex-direction:row}
  .c{aspect-ratio:auto;min-height:52px;padding:7px;font-size:12.5px}
  .c small{display:none}
  .cgrid{gap:4px}
  .cal{padding:14px}
  .glance{padding:22px}
  .finder .pair{flex-wrap:wrap}
  .actions .btn{width:100%}

/* ================= state ================= */
var KEY='cyclesync.v1';
var DEFAULT={starts:[],cycleLen:28,periodLen:5,bMonth:null,bDay:null,zip:'',remember:true};
function loadState(){
  var s=JSON.parse(JSON.stringify(DEFAULT));
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw)return s;
    var o=JSON.parse(raw);
    if(Array.isArray(o.starts)){
      s.starts=o.starts.filter(function(x){return typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&numToISO(isoToNum(x))===x;}).sort().slice(-12);
    }
    var cl=parseInt(o.cycleLen,10);if(cl>=21&&cl<=35)s.cycleLen=cl;
    var pl=parseInt(o.periodLen,10);if(pl>=2&&pl<=8)s.periodLen=pl;
    var bm=parseInt(o.bMonth,10),bd=parseInt(o.bDay,10);
    if(bm>=1&&bm<=12&&bd>=1&&bd<=DIM[bm-1]){s.bMonth=bm;s.bDay=bd;}
    if(typeof o.zip==='string'&&validZip(o.zip))s.zip=o.zip.trim();
    s.remember=o.remember!==false;
  }catch(e){}
  return s;
}
var state=loadState();
function persist(){
  try{
    if(state.remember)localStorage.setItem(KEY,JSON.stringify(state));
    else localStorage.removeItem(KEY);
  }catch(e){}
}
function logStart(iso){
  var n=isoToNum(iso);
  var s=state.starts.filter(function(x){return Math.abs(isoToNum(x)-n)>=15;});
  s.push(iso);s.sort();
  state.starts=s.slice(-12);
  persist();
}
function curSign(){return state.bMonth&&state.bDay?signFor(state.bMonth,state.bDay):null;}

/* ================= cycle math ================= */
function phaseMap(len,per){
  len=Math.max(21,len);
  per=Math.max(2,Math.min(per,len-15));
  var lut=len-10,ov=len-13;
  return {len:len,per:per,menEnd:per,folStart:per+1,folEnd:ov-1,ovStart:ov,ovEnd:lut-1,lutStart:lut,pmsStart:len-5};
}
function phaseOfDay(day,pm){
  if(day<=pm.menEnd)return 'menstrual';
  if(day<=pm.folEnd)return 'follicular';
  if(day<=pm.ovEnd)return 'ovulation';
  return 'luteal';
}
function rangeOf(id,pm){
  var r={menstrual:[1,pm.menEnd],follicular:[pm.folStart,pm.folEnd],ovulation:[pm.ovStart,pm.ovEnd],luteal:[pm.lutStart,pm.len]}[id];
  return r[0]===r[1]?'Day '+r[0]:'Day '+r[0]+'–'+r[1];
}
function model(){
  return {starts:state.starts.map(isoToNum).sort(function(a,b){return a-b;}),L:state.cycleLen,per:state.periodLen};
}
function info(m,dn){
  var st,len,logged=false,S=m.starts,L=m.L;
  if(dn<S[0]){
    var k=Math.ceil((S[0]-dn)/L);st=S[0]-k*L;len=L;
  }else{
    var i=S.length-1;
    while(S[i]>dn)i--;
    st=S[i];
    if(i<S.length-1){len=S[i+1]-st;logged=true;}
    else{
      var kk=Math.floor((dn-st)/L);
      logged=(kk===0);
      st=st+kk*L;len=L;
    }
  }
  var pm=phaseMap(len,m.per);
  var day=dn-st+1;
  var ph=phaseOfDay(day,pm);
  return {day:day,len:len,start:st,logged:logged,pm:pm,phase:ph,pms:ph==='luteal'&&day>=pm.pmsStart};
}
function upNext(c){
  var pm=c.pm;
  var cands=[[pm.folStart,'Follicular phase begins'],[pm.ovStart,'Ovulation phase begins'],[pm.lutStart,'Luteal phase begins'],[pm.pmsStart,'PMS window begins'],[c.len+1,'Period expected']];
  var nx=cands.filter(function(x){return x[0]>c.day;}).sort(function(a,b){return a[0]-b[0];})[0];
  return {label:nx[1],days:nx[0]-c.day,date:c.start+nx[0]-1};
}
function nextOv(c){
  if(c.day<=c.pm.ovEnd){return [c.start+c.pm.ovStart-1,c.start+c.pm.ovEnd-1];}
  var pm2=phaseMap(state.cycleLen,state.periodLen),ns=c.start+c.len;
  return [ns+pm2.ovStart-1,ns+pm2.ovEnd-1];
}
function observedAvg(){
  var s=state.starts.map(isoToNum),d=[];
  for(var i=1;i<s.length;i++){var x=s[i]-s[i-1];if(x>=21&&x<=35)d.push(x);}
  if(!d.length)return null;
  return Math.round(d.reduce(function(a,b){return a+b;},0)/d.length);
}

function calCell(dn,month,today,sel,m){
  var c=info(m,dn),pm=c.pm,cls='c',tag='',dd=ymd(dn);
  var outside=dd.m!==month.m;
  if(c.phase==='menstrual'){
    if(!c.logged&&dn>=today){cls+=' nx';tag=c.day===1?'PERIOD DUE':'';}
    else if(c.day===1){cls+=' m1';tag='PERIOD STARTS';}
    else cls+=' m';
  }else if(c.phase==='follicular')cls+=' f';
  else if(c.phase==='ovulation'){if(c.day===pm.ovStart){cls+=' o1';tag='OVULATION';}else cls+=' o';}
  else{if(c.pms){cls+=' p';if(c.day===pm.pmsStart)tag='PMS BEGINS';}else cls+=' l';}
  if(dn===today){cls+=' now';tag='TODAY';}
  if(outside)cls+=' out';
  var label=(dd.d===1?fmt(dn,MD):dd.d);
  return '<button type="button" class="'+cls+'" data-act="cday" data-n="'+dn+'" data-k="c'+dn+'" aria-pressed="'+(dn===sel)+'" aria-label="'+fmt(dn,{weekday:'long',month:'long',day:'numeric'})+', day '+c.day+', '+PHASES[c.phase].name+' phase'+(c.pms?', PMS window':'')+(dn===today?', today':'')+'"><span>'+label+'</span><small>'+tag+'</small></button>';
}

  var cm=ui.calMonth,first=fromYMD(cm.y,cm.m,1),f=ymd(first);
  var dim=ymd(fromYMD(cm.y,cm.m+1,0)).d,rows=Math.ceil((f.dow+dim)/7),startGrid=first-f.dow;
  var cells='';
  ['SUN','MON','TUE','WED','THU','FRI','SAT'].forEach(function(w){cells+='<div class="wk">'+w+'</div>';});
  for(var i=0;i<rows*7;i++)cells+=calCell(startGrid+i,cm,t,ui.calSel,m);

  var cur=info(m,t),pms=cur.pm,pmsA=cur.start+pms.pmsStart-1,pmsB=cur.start+cur.len-1;
  var ov=nextOv(cur);
  var sc=info(m,ui.calSel),SP=PHASES[sc.phase];
  var avg=observedAvg();
  var logs=state.starts.slice().reverse().map(function(iso){return '<div class="logrow"><span>'+fmt(isoToNum(iso),{weekday:'short',month:'short',day:'numeric',year:'numeric'})+'</span><button type="button" data-act="rmlog" data-iso="'+iso+'" aria-label="Remove '+iso+'">Remove</button></div>';}).join('');
  var maxISO=numToISO(t);

  return '<div class="container"><div class="eyebrow">Calendar</div><h1 class="h1">Her cycle, month by month</h1>'+
    '<p class="lead">Every day is colored by phase, with predictions that update as you log each new period. Tap a day to see what it means.</p>'+
    '<div class="cal-grid" style="margin-top:32px"><div class="side">'+
    '<div class="card"><h3>Log a period</h3><form data-form="log"><label class="lbl" for="f-log">First day of a period</label><input class="field fld" id="f-log" name="log" type="date" max="'+maxISO+'" value="'+maxISO+'" style="margin-bottom:12px"><button class="btn sm" type="submit" style="width:100%">Add to calendar</button></form><p class="msg" role="status">'+esc(ui.calMsg)+'</p>'+
    (logs?'<div style="margin-top:8px"><div class="tag muted" style="margin-bottom:6px">Logged periods</div>'+logs+'</div>':'')+'</div>'+
    '<div class="card"><h3>Her cycle</h3><div class="fld"><label class="lbl" for="f-cl">Average cycle length (21–35 days)</label><input class="field" id="f-cl" data-field="cl" type="number" min="21" max="35" inputmode="numeric" value="'+state.cycleLen+'"></div>'+
    '<div class="fld"><label class="lbl" for="f-pl">Typical period length (2–8 days)</label><input class="field" id="f-pl" data-field="pl" type="number" min="2" max="8" inputmode="numeric" value="'+state.periodLen+'"></div>'+
    (avg&&avg!==state.cycleLen?'<p class="note" style="margin:0 0 12px">Your logged cycles average <strong>'+avg+' days</strong>.</p><button type="button" class="btn sm line" data-act="useavg" data-v="'+avg+'" style="width:100%">Use '+avg+' days</button>':'')+'</div>'+
    '<div class="card"><h3>Legend</h3><div class="lg"><div><span class="dot" style="background:var(--c-menstrual)"></span>Menstrual</div><div><span class="dot" style="background:var(--c-follicular)"></span>Follicular</div><div><span class="dot" style="background:var(--c-ovulation)"></span>Ovulation</div><div><span class="dot" style="background:var(--c-luteal)"></span>Luteal (solid = PMS window)</div><div class="muted"><span style="width:10px;height:10px;border:1.5px dashed var(--rose);border-radius:3px;display:inline-block"></span>Predicted period</div></div></div>'+
    '<div class="card preds"><h3>Predictions</h3><div class="row"><span>Today</span><strong>Day '+cur.day+' · '+PHASES[cur.phase].name+'</strong></div><div class="row"><span>PMS window</span><strong>'+fmtRange(pmsA,pmsB)+'</strong></div><div class="row"><span>Next period</span><strong>'+fmt(cur.start+cur.len,MD)+'</strong></div><div class="row"><span>Next ovulation phase</span><strong>'+fmtRange(ov[0],ov[1])+'</strong></div></div>'+
    '</div><div><div class="cal-h"><h2>'+MONTHS[cm.m]+' '+cm.y+'</h2><div class="mc-nav"><button type="button" class="btn sm line" data-act="today-m" style="min-height:44px">Today</button><button type="button" class="sq" data-act="cm" data-d="-1" aria-label="Previous month">‹</button><button type="button" class="sq" data-act="cm" data-d="1" aria-label="Next month">›</button></div></div>'+
    '<div class="card cal"><div class="cgrid">'+cells+'</div></div>'+
    '<div class="card detail t-'+sc.phase+'"><h3>'+fmt(ui.calSel,{weekday:'long',month:'long',day:'numeric'})+' · day '+sc.day+' of '+sc.len+'</h3>'+
    '<p><strong style="color:var(--pi)">'+SP.name+' phase</strong>'+(sc.pms?' · PMS window':'')+' · focus: '+SP.focus.toLowerCase()+'</p>'+
    '<div class="li"><span class="ic">1</span><span>'+esc(SP.help[0])+'</span></div><div class="li"><span class="ic">2</span><span>'+esc(SP.help[1])+'</span></div>'+
    '<p style="margin-top:12px"><button type="button" class="link" data-act="goPhase" data-p="'+sc.phase+'">See the '+SP.name.toLowerCase()+' phase in full →</button></p></div>'+
    '<p class="note" style="text-align:center">Predictions are estimates from an average cycle length. Actual timing varies from month to month. Educational only, not medical advice.</p></div></div></div>';
}

function viewZodiac(){
  var mine=curSign(),b={m:state.bMonth,d:state.bDay};
  var monthOpts='<option value="">Month</option>'+MONTHS.map(function(n,i){return '<option value="'+(i+1)+'"'+(b.m===i+1?' selected':'')+'>'+n+'</option>';}).join('');
  var maxDay=b.m?DIM[b.m-1]:31,dayOpts='<option value="">Day</option>';
  for(var x=1;x<=maxDay;x++)dayOpts+='<option value="'+x+'"'+(b.d===x?' selected':'')+'>'+x+'</option>';
  var result=mine?'<div class="signchip" style="margin-bottom:18px" aria-live="polite">'+glyph(mine)+'<div><b>'+mine.n+'</b><small>'+ELEMENTS[mine.el].name+' sign · '+mine.dt+'</small></div></div>'+
      '<a class="btn" style="width:100%;min-height:48px;font-size:15px" href="#today">See her sign on my Today view →</a><p class="note" style="text-align:center;margin-top:12px">Born on a cusp? Check both signs and go with whichever sounds like her. <button type="button" class="link" style="min-height:44px;font-size:12.5px" data-act="clearsign">Remove her sign</button></p>':
    '<div class="signchip" style="margin-bottom:18px;background:var(--cream);border:1px dashed #CFC6B8;color:var(--soft)" aria-live="polite"><div><b>Her sun sign appears here</b><small>Pick a month and day</small></div></div><p class="note" style="margin:0">Saved only on this device.</p>';

  var grid=SIGNS.map(function(s){
    var on=mine&&mine.n===s.n;
    return '<div class="sign'+(on?' on':'')+'"><div class="top"><span class="glyph g" aria-hidden="true">'+s.g+'︎</span><span class="el">'+ELEMENTS[s.el].name+'</span></div><h3>'+s.n+(on?' <span class="tag" style="color:var(--purple-ink);font-family:var(--sans);margin-left:6px">Her sign</span>':'')+'</h3><div class="dt">'+s.dt+'</div><p>'+esc(s.t)+'</p><p class="sup"><strong>Support:</strong> '+esc(s.s)+'</p></div>';
  }).join('');

  var cur=state.starts.length?info(model(),todayNum()).phase:null;
  var els=['fire','earth','air','water'].map(function(k){
    var E=ELEMENTS[k];
    var rows=ORDER.map(function(id){return '<div class="ph-row t-'+id+(cur===id?' now':'')+'"><b>'+PHASES[id].name+(cur===id?' · she’s here now':'')+'</b>'+esc(E.tip[id])+'</div>';}).join('');
    return '<div class="card el-card"><div><div class="tag" style="color:var(--purple-ink)">'+E.name+'</div><h3>'+E.signs+'</h3></div><p class="lead2"><strong>'+esc(E.lead.split('. ')[0])+'.</strong> '+esc(E.lead.split('. ').slice(1).join('. '))+'</p><div class="list" style="gap:10px">'+rows+'</div></div>';
  }).join('');

  return '<div class="container"><div class="zhero"><div><div class="eyebrow" style="color:var(--purple-ink)">Zodiac guide · for the curious</div><h1 class="h1">Decode her sign.<br>Support her better.</h1><p class="lead">Her cycle phase tells you what her body is doing. Her sun sign adds a layer of personality: how she tends to handle that phase and what kind of support lands best. Use both as a lens, and let her correct you.</p></div>'+
    '<div class="card finder"><h2>Find her sign</h2><div class="pair"><div style="flex:1"><label class="lbl" for="z-m">Birth month</label><select class="field" id="z-m" data-field="zm" style="width:100%">'+monthOpts+'</select></div><div style="width:100px"><label class="lbl" for="z-d">Day</label><select class="field" id="z-d" data-field="zd" style="width:100%">'+dayOpts+'</select></div></div>'+result+'</div></div>'+
    '<div class="sec"><div class="sec-head"><h2>The twelve signs at a glance</h2><span class="muted" style="font-size:13.5px">Tendencies, not rules</span></div><div class="g4">'+grid+'</div></div>'+
    '<div class="sec"><div class="sec-head"><h2>Element cheat sheet: how each element meets each phase</h2><span class="muted" style="font-size:13.5px">Find her sign’s element, then read down the four phases</span></div><div class="g4">'+els+'</div></div>'+
    '<div class="sec"><div class="disc"><h3>A note on astrology</h3><p>Astrology isn’t science. Sun signs don’t determine behavior, and how a cycle affects mood differs widely between women, with or without a sign. We include it because many people enjoy it and it gives you a friendly way to start a conversation. Treat every tip here as a prompt to notice and ask, and trust what she tells you over what any chart suggests.</p></div></div></div>';
}

/* ================= router ================= */
var VIEWS=['start','today','phases','calendar','zodiac'];
var TITLES={start:'Start here',today:'Today',phases:'The 4 phases',calendar:'Calendar',zodiac:'Zodiac guide'};
var RENDER={start:viewStart,today:viewToday,phases:viewPhases,calendar:viewCalendar,zodiac:viewZodiac};
function currentView(){var h=location.hash.replace('#','');return VIEWS.indexOf(h)>=0?h:null;}
function paint(v){
  var sec=document.getElementById('view-'+v);
  var ae=document.activeElement,key=null;
  if(ae&&sec.contains(ae)){key=ae.id?'#'+ae.id:(ae.getAttribute('data-k')?'[data-k="'+ae.getAttribute('data-k')+'"]':null);}
  sec.innerHTML=RENDER[v]();
  if(key){var el=sec.querySelector(key);if(el){try{el.focus({preventScroll:true});}catch(e){el.focus();}}}
}
function route(scroll){
  var v=currentView();
  if(!v){v=state.starts.length?'today':'start';history.replaceState(null,'','#'+v);}
  if(v==='start'&&scroll!==false)initDraft();
  VIEWS.forEach(function(x){document.getElementById('view-'+x).hidden=(x!==v);});
  paint(v);
  document.querySelectorAll('nav.main a').forEach(function(a){
    if(a.getAttribute('data-nav')===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
  });
  document.title=TITLES[v]+' · Cycle Sync';
  if(scroll!==false){window.scrollTo(0,0);}
}
function rerender(){var v=currentView();if(v)paint(v);}
function go(v){if(location.hash==='#'+v)route();else location.hash=v;}
window.addEventListener('hashchange',function(){route();});
var toastT;
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('on');},2600);}

/* ================= events ================= */
function setZodiac(mo,da){
  state.bMonth=mo||null;
  if(!mo){state.bDay=null;}
  else{
    state.bDay=(da&&da<=DIM[mo-1])?da:null;
  }
  persist();
}
function commitStart(){
  var d=ui.draft,t=todayNum();
  if(d.date==null){ui.error='Pick the first day of her last period to continue.';rerender();return;}
  if(d.date>t){ui.error='That date is in the future. Pick the day her last period began.';rerender();return;}
  var iso=numToISO(d.date),last=state.starts[state.starts.length-1];
  if(last!==iso)logStart(iso);
  state.cycleLen=Math.max(21,Math.min(35,d.cycleLen||28));
  if(d.bMonth&&d.bDay&&d.bDay<=DIM[d.bMonth-1]){state.bMonth=d.bMonth;state.bDay=d.bDay;}else{state.bMonth=null;state.bDay=null;}
  state.remember=d.remember;
  ui.error='';
  persist();
  toast(state.remember?'Saved on this device':'Not saved. This stays only while the page is open');
  go('today');
}
document.addEventListener('click',function(e){
  var z=e.target.closest('[data-needzip]');
  if(z){
    e.preventDefault();
    var lf=z.closest('.lf'),inp=lf.querySelector('input'),msg=lf.querySelector('[data-lfmsg]');
    msg.textContent='Add your ZIP code first, then tap a spot type.';inp.focus();return;
  }
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var a=el.getAttribute('data-act'),d=ui.draft;
  switch(a){
    case 'chip':d.date=todayNum()-parseInt(el.getAttribute('data-off'),10);ui.unsure=false;ui.error='';{var y=ymd(d.date);ui.startMonth={y:y.y,m:y.m};}rerender();break;
    case 'exact':ui.unsure=false;if(d.date==null){d.date=todayNum();ui.error='';}rerender();break;
    case 'unsure':ui.unsure=!ui.unsure;rerender();break;
    case 'pick':d.date=parseInt(el.getAttribute('data-n'),10);ui.unsure=false;ui.error='';rerender();break;
    case 'sm':{var s=ui.startMonth,dd=parseInt(el.getAttribute('data-d'),10),nm=s.m+dd,ny=s.y;if(nm<0){nm=11;ny--;}if(nm>11){nm=0;ny++;}ui.startMonth={y:ny,m:nm};rerender();break;}
    case 'cl':{var v=el.getAttribute('data-v');if(v==='custom'){ui.custom=true;}else{ui.custom=false;d.cycleLen=parseInt(v,10);}rerender();break;}
    case 'startgo':commitStart();break;
    case 'goPhase':ui.phase=el.getAttribute('data-p');go('phases');break;
    case 'ptab':ui.phase=el.getAttribute('data-p');rerender();break;
    case 'logtoday':if(window.confirm('Log today as the first day of her new period?')){logStart(numToISO(todayNum()));toast('Period logged');ui.calSel=null;rerender();}break;
    case 'cm':{var c=ui.calMonth,k=parseInt(el.getAttribute('data-d'),10),m2=c.m+k,y2=c.y;if(m2<0){m2=11;y2--;}if(m2>11){m2=0;y2++;}ui.calMonth={y:y2,m:m2};rerender();break;}
    case 'today-m':{var tt=ymd(todayNum());ui.calMonth={y:tt.y,m:tt.m};ui.calSel=todayNum();rerender();break;}
    case 'cday':ui.calSel=parseInt(el.getAttribute('data-n'),10);rerender();break;
    case 'rmlog':state.starts=state.starts.filter(function(x){return x!==el.getAttribute('data-iso');});persist();ui.calMsg='';toast('Removed');if(!state.starts.length)go('start');else rerender();break;
    case 'useavg':state.cycleLen=parseInt(el.getAttribute('data-v'),10);persist();toast('Cycle length updated');rerender();break;
    case 'clearsign':setZodiac(null,null);rerender();break;
  }
});
document.addEventListener('change',function(e){
  var el=e.target,f=el.getAttribute&&el.getAttribute('data-field');
  if(!f)return;
  var d=ui.draft;
  if(f==='bm'){d.bMonth=el.value?parseInt(el.value,10):null;if(d.bMonth&&d.bDay>DIM[d.bMonth-1])d.bDay=null;if(!d.bMonth)d.bDay=null;rerender();}
  else if(f==='bd'){d.bDay=el.value?parseInt(el.value,10):null;rerender();}
  else if(f==='custom'){var v=parseInt(el.value,10);if(v>=21&&v<=35){d.cycleLen=v;}else{ui.error='Cycle length should be between 21 and 35 days.';}rerender();}
  else if(f==='remember'){d.remember=el.checked;}
  else if(f==='cl'){var c=parseInt(el.value,10);if(c>=21&&c<=35){state.cycleLen=c;persist();rerender();}else{toast('Cycle length should be 21–35 days');el.value=state.cycleLen;}}
  else if(f==='pl'){var p=parseInt(el.value,10);if(p>=2&&p<=8){state.periodLen=p;persist();rerender();}else{toast('Period length should be 2–8 days');el.value=state.periodLen;}}
  else if(f==='zm'){setZodiac(el.value?parseInt(el.value,10):null,state.bDay);rerender();}
  else if(f==='zd'){setZodiac(state.bMonth,el.value?parseInt(el.value,10):null);rerender();}
});
document.addEventListener('submit',function(e){
  var form=e.target,kind=form.getAttribute('data-form');
  if(!kind)return;
  e.preventDefault();
  if(kind==='zip'){
    var lf=form.closest('.lf'),inp=form.querySelector('input'),msg=lf.querySelector('[data-lfmsg]'),val=inp.value.trim();
    if(!validZip(val)){msg.textContent='Enter a ZIP (like 60614) or postal code.';inp.focus();return;}
    state.zip=val;persist();
    var pid=lf.getAttribute('data-pid');
    lf.querySelector('[data-kind="food"]').innerHTML=lfChips(PHASES[pid].local.food,val);
    lf.querySelector('[data-kind="act"]').innerHTML=lfChips(PHASES[pid].local.act,val);
    msg.style.color='#CFE9D3';msg.textContent='Ready. Tap any spot type to open it in Google Maps.';
  }else if(kind==='log'){
    var v=form.querySelector('input').value;
    if(!v){ui.calMsg='Pick a date first.';rerender();return;}
    var n=isoToNum(v);
    if(n>todayNum()){ui.calMsg='That date is in the future.';rerender();return;}
    logStart(v);ui.calMsg='Added.';ui.calSel=n;
    var y=ymd(n);ui.calMonth={y:y.y,m:y.m};
    rerender();
  }
});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act="clear"]');
  if(!el)return;
  if(window.confirm('Remove everything Cycle Sync has saved on this device?')){
    try{localStorage.removeItem(KEY);}catch(err){}
    state=JSON.parse(JSON.stringify(DEFAULT));ui.phase=null;ui.calMonth=null;ui.calSel=null;
    initDraft();toast('Saved data cleared');go('start');
  }
});

route(false);
})();
</script>
</body>
</html>
